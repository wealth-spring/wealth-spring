<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Invest - WealthSpring</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f9fb;
      padding: 50px;
      text-align: center;
    }
    h2 {
      color: #0a3d62;
    }
    select, .button {
      padding: 12px;
      font-size: 16px;
      margin: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    .button {
      background: #0984e3;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h2>Choose Your Investment Plan</h2>

  <label for="currency">Currency:</label><br>
  <select id="currency">
    <option value="NGN">Naira (₦)</option>
    <option value="USD">Dollar ($)</option>
  </select><br><br>

  <label for="amount">Investment Amount:</label><br>
  <select id="amount">
    <option value="10000">₦10,000 / $10</option>
    <option value="25000">₦25,000 / $25</option>
    <option value="50000">₦50,000 / $50</option>
    <option value="100000">₦100,000 / $100</option>
  </select><br><br>

  <button class="button" onclick="payWithPaystack()">Invest Now</button>

  <script src="https://js.paystack.co/v1/inline.js"></script>
  <script>
    function payWithPaystack() {
      const currency = document.getElementById("currency").value;
      const amount = parseInt(document.getElementById("amount").value);
      const email = "investor@example.com"; // You can replace this dynamically

      const handler = PaystackPop.setup({
        key: 'pk_live_d0f6605d9e40755f6d1d0d7ce9a9203d370ad6d0', // Your public key
        email: email,
        amount: currency === "NGN" ? amount * 100 : amount * 100, // Both NGN & USD use *100 for kobo/cents
        currency: currency,
        ref: 'INVEST-' + Math.floor((Math.random() * 1000000000) + 1),
        callback: function(response) {
          alert('Payment successful! Reference: ' + response.reference);
          window.location.href = "success.html";
        },
        onClose: function() {
          alert('Payment cancelled.');
        }
      });
      handler.openIframe();
    }
  </script>

</body>
</html>
