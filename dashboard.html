<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard - WealthSpring</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f1f4f9;
      margin: 0;
      padding: 0;
    }

    .header {
      background-color: #0a3d62;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 15px rgba(0,0,0,0.05);
    }

    .section {
      margin-bottom: 30px;
    }

    h2 {
      color: #0a3d62;
      margin-bottom: 10px;
    }

    .info-box {
      display: flex;
      justify-content: space-between;
      background: #e0f0ff;
      padding: 15px 20px;
      border-radius: 8px;
      margin: 10px 0;
    }

    .bonus {
      background-color: #d1ffd1;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
    }

    .bonus button {
      background: green;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    .bonus button:disabled {
      background: gray;
    }

    .referrals {
      background: #f8f9fc;
      padding: 15px;
      border-radius: 10px;
    }

    .btn-logout {
      background-color: #e74c3c;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      float: right;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>WealthSpring Dashboard</h1>
    <button class="btn-logout" onclick="logout()">Logout</button>
  </div>

  <div class="container">
    <!-- Investment Plan Section -->
    <div class="section">
      <h2>Your Investment Plan</h2>
      <div class="info-box">
        <div><strong>Plan:</strong> <span id="userPlan">Gold</span></div>
        <div><strong>Daily Earnings:</strong> $<span id="dailyEarnings">10.00</span></div>
        <div><strong>Total Earned:</strong> $<span id="totalEarned">120.00</span></div>
      </div>
    </div>

    <!-- Daily Bonus Section -->
    <div class="section bonus">
      <h2>🎁 Daily Login Bonus</h2>
      <p>Claim $0.50 daily. Accumulates every Friday to your balance.</p>
      <button id="claimBtn" onclick="claimBonus()">Claim $0.50</button>
      <p id="claimMsg" style="margin-top: 10px; color: green;"></p>
    </div>

    <!-- Referrals Section -->
    <div class="section referrals">
      <h2>Referral Stats</h2>
      <p><strong>Total Referrals:</strong> <span id="refCount">8</span></p>
      <p><strong>Earnings from Referrals:</strong> $<span id="refEarnings">24.00</span></p>
    </div>
  </div>

  <script>
    // Check if user is activated
    if (localStorage.getItem("isActivated") !== "true") {
      // Redirect to activation page if not activated
      window.location.href = "pay.html";
    }

    // Simulated example — this would normally be from a database
    let claimedToday = localStorage.getItem("dailyBonusClaimed");

    function claimBonus() {
      const today = new Date().toDateString();
      if (claimedToday === today) {
        document.getElementById("claimMsg").innerText = "You have already claimed today's bonus.";
        return;
      }

      // Save the bonus claim status
      localStorage.setItem("dailyBonusClaimed", today);
      document.getElementById("claimMsg").innerText = "Bonus claimed! $0.50 will be added this Friday.";
      document.getElementById("claimBtn").disabled = true;
    }

    window.onload = () => {
      const today = new Date().toDateString();
      if (claimedToday === today) {
        document.getElementById("claimBtn").disabled = true;
        document.getElementById("claimMsg").innerText = "You have already claimed today's bonus.";
      }
    };

    function logout() {
      alert("You have been logged out.");
      window.location.href = 'login.html';
    }
  </script>

</body>
</html>
