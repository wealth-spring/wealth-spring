<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Payment Successful - WealthSpring</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #e9f5ff;
      padding: 50px;
      text-align: center;
    }
    .container {
      background: white;
      max-width: 500px;
      margin: auto;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 2px 15px rgba(0,0,0,0.1);
    }
    h2 {
      color: #0a3d62;
    }
    p {
      font-size: 16px;
      color: #444;
    }
    .success {
      font-size: 80px;
      color: green;
      margin-bottom: 20px;
    }
    .btn {
      margin-top: 25px;
      background-color: #0984e3;
      color: white;
      padding: 12px 25px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }
    .btn:hover {
      background-color: #065ea9;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="success">✔</div>
    <h2>Payment Successful!</h2>
    <p id="planInfo">Loading your investment details...</p>
    <p id="refInfo"></p>
    <button class="btn" onclick="window.location.href='dashboard.html'">Go to Dashboard</button>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const plan = urlParams.get('plan') || 'N/A';
    const ref = urlParams.get('ref') || 'N/A';

    document.getElementById('planInfo').innerText = `You have successfully invested in the "${plan}" plan.`;
    document.getElementById('refInfo').innerText = `Reference: ${ref}`;
  </script>

</body>
</html>
