<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Payment - WealthSpring</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f9fb;
      padding: 50px;
      text-align: center;
    }
    h2 {
      color: #0a3d62;
    }
    .button {
      background: #0984e3;
      color: white;
      padding: 15px 30px;
      border: none;
      font-size: 18px;
      cursor: pointer;
      border-radius: 8px;
    }
    .button:hover {
      background: #065ea9;
    }
  </style>
</head>
<body>

  <h2>Make Payment for Your Investment</h2>
  <p>Click the button below to securely pay and start investing.</p>

  <!-- Options to choose amount -->
  <div>
    <button class="button" onclick="payWithPaystack(1000000, 'NGN')">Invest ₦10,000</button>
    <button class="button" onclick="payWithPaystack(5000000, 'NGN')">Invest ₦50,000</button>
    <button class="button" onclick="payWithPaystack(10000000, 'NGN')">Invest ₦100,000</button>
    <button class="button" onclick="payWithPaystack(5000000, 'USD')">Invest $500</button>
    <button class="button" onclick="payWithPaystack(10000000, 'USD')">Invest $1000</button>
  </div>

  <script src="https://js.paystack.co/v1/inline.js"></script>
  <script>
    function payWithPaystack(amount, currency) {
      var handler = PaystackPop.setup({
        key: 'pk_live_d0f6605d9e40755f6d1d0d7ce9a9203d370ad6d0', // 🔁 Replace with your actual LIVE key
        email: 'gainflow31@@gmail.com',   // Replace with dynamic email later
        amount: amount,                   // Amount to be paid (in kobo for Naira or cents for USD)
        currency: currency,               // Currency type: NGN or USD
        ref: 'INVEST-' + Math.floor((Math.random() * 1000000000) + 1), // Unique reference for the transaction
        callback: function(response) {
          alert('Payment Successful! Reference: ' + response.reference);
          window.location.href = 'success.html?plan=' + currency + '&ref=' + response.reference; // Redirect to success page
        },
        onClose: function() {
          alert('Payment cancelled.');
        }
      });
      handler.openIframe();
    }
  </script>

</body>
</html>
